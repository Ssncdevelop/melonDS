name: Windows

on:
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:
      - master

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v3
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        update: true
        pacboy: gcc:p cmake:p ninja:p make:p
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-x86_64-mingw-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-x86_64-mingw-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    # MSYS2's login shell sets PKG_CONFIG_PATH to its own /ucrt64 packages. MSYS2's
    # cmake pulls in MSYS2's libarchive, whose static library expects zlib as a DLL,
    # and pkg-config would find it before vcpkg's: the static link then fails on
    # __imp_inflate*. Without the variable, pkg-config sees only vcpkg's packages.
    - name: Configure
      run: unset PKG_CONFIG_PATH; cmake --preset=release-mingw-x86_64 -DMELONDS_EMBED_BUILD_INFO=ON
    - name: Build
      run: unset PKG_CONFIG_PATH; cmake --build --preset=release-mingw-x86_64
    # The exe links the vcpkg packages statically; their licenses ask for their
    # notices to go with the binary. vcpkg leaves each one in share/<port>/copyright.
    - name: Collect third-party notices
      run: |
        inst=$(find build -type d -path '*vcpkg_installed/x64-mingw-static-release' | head -n 1)
        echo "vcpkg installed dir: $inst"
        {
          echo "Third-party software built by vcpkg and linked statically into melonDS.exe"
          echo "(one section per vcpkg port, from its share/<port>/copyright)."
          echo
          for d in "$inst"/share/*/; do
            [ -f "$d/copyright" ] || continue
            echo "======================================================================"
            basename "$d"
            echo "======================================================================"
            cat "$d/copyright"
            echo
          done
        } > THIRD-PARTY-NOTICES-vcpkg.txt
        ls "$inst"/share || true
    - uses: actions/upload-artifact@v4
      with:
        name: melonDS-windows-x86_64
        path: |
          .\build\release-mingw-x86_64\melonDS.exe
          THIRD-PARTY-NOTICES-vcpkg.txt
    - name: Save vcpkg cache
      # also when the build fails, so a retry does not compile Qt again
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-x86_64-mingw-${{ hashFiles('vcpkg.json') }}
